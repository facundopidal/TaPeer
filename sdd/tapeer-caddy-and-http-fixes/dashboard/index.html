<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Dashboard</title>
  <style>
    :root {
      --bg-color: #F4F0EA;
      --text-color: #102A1E;
      --border-color: #6F583D;
      --card-bg: #ffffff;
      --accent-color: #1D4D36;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }
    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      font-weight: 800;
    }
    .subtitle {
      color: var(--border-color);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    .card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 4px 4px 0 var(--border-color);
    }
    .app-list {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .app-item a {
      display: block;
      padding: 1rem;
      background-color: var(--bg-color);
      color: var(--text-color);
      text-decoration: none;
      font-weight: 700;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 3px 3px 0 var(--border-color);
      transition: all 0.15s ease;
    }
    .app-item a:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--border-color);
      background-color: var(--accent-color);
      color: var(--bg-color);
    }
    .app-item a:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Server Dashboard</h1>
      <p class="subtitle">Select an application to launch</p>
    </header>
    <main class="card">
      <ul class="app-list">
        <li class="app-item">
          <a href="/tapeer/">🍃 Launch TaPeer (File & Text Sharing)</a>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
