<svg viewBox="0 0 300 200" width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shadows/Ground -->
  <ellipse cx="150" cy="170" rx="80" ry="10" fill="#dcd7cd" />
  
  <!-- Back Legs -->
  <rect x="110" y="120" width="16" height="45" rx="8" fill="#1f1f1f" />
  <rect x="170" y="120" width="16" height="45" rx="8" fill="#1f1f1f" />

  <!-- Body -->
  <ellipse cx="150" cy="115" rx="65" ry="48" fill="#2C2C2C" />
  
  <!-- Front Legs -->
  <rect x="95" y="120" width="18" height="45" rx="9" fill="#2C2C2C" />
  <rect x="155" y="120" width="18" height="45" rx="9" fill="#2C2C2C" />

  <!-- Tail -->
  <path d="M 215 110 Q 230 115 225 125" stroke="#2C2C2C" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- Head Group -->
  <g>
    <!-- Ears -->
    <ellipse cx="95" cy="65" rx="10" ry="16" fill="#1f1f1f" transform="rotate(-15 95 65)" />
    <ellipse cx="105" cy="60" rx="11" ry="18" fill="#2C2C2C" transform="rotate(10 105 60)" />
    
    <!-- Head Base -->
    <ellipse cx="90" cy="90" rx="30" ry="25" fill="#2C2C2C" />
    
    <!-- Snout (Long Nose) -->
    <g>
      <!-- Upper snout -->
      <path d="M 70 80 Q 40 80 35 100 Q 55 110 75 98 Z" fill="#2C2C2C" />
      <!-- Nostril -->
      <circle cx="42" cy="98" r="2.5" fill="#1a1a1a" />
    </g>
    
    <!-- Eye -->
    <circle cx="85" cy="85" r="3.5" fill="#FFFFFF" />
    <circle cx="84" cy="84" r="1.5" fill="#000000" />
  </g>
</svg>
